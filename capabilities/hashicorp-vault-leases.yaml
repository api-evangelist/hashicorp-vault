naftiko: 1.0.0-alpha2
info:
  label: HashiCorp Vault HTTP API — Leases
  description: 'HashiCorp Vault HTTP API — Leases. 3 operations. Lead operation: Lookup a lease. Self-contained Naftiko capability
    covering one Hashicorp Vault business surface.'
  tags:
  - Hashicorp Vault
  - Leases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HASHICORP_VAULT_API_KEY: HASHICORP_VAULT_API_KEY
capability:
  consumes:
  - type: http
    namespace: hashicorp-vault-leases
    baseUri: https://127.0.0.1:8200/v1
    description: HashiCorp Vault HTTP API — Leases business capability. Self-contained, no shared references.
    resources:
    - name: sys-leases-lookup
      path: /sys/leases/lookup
      operations:
      - name: lookuplease
        method: PUT
        description: Lookup a lease
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sys-leases-renew
      path: /sys/leases/renew
      operations:
      - name: renewlease
        method: PUT
        description: Renew a lease
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sys-leases-revoke
      path: /sys/leases/revoke
      operations:
      - name: revokelease
        method: PUT
        description: Revoke a lease
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Vault-Token
      value: '{{env.HASHICORP_VAULT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: hashicorp-vault-leases-rest
    port: 8080
    description: REST adapter for HashiCorp Vault HTTP API — Leases. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/sys/leases/lookup
      name: sys-leases-lookup
      description: REST surface for sys-leases-lookup.
      operations:
      - method: PUT
        name: lookuplease
        description: Lookup a lease
        call: hashicorp-vault-leases.lookuplease
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sys/leases/renew
      name: sys-leases-renew
      description: REST surface for sys-leases-renew.
      operations:
      - method: PUT
        name: renewlease
        description: Renew a lease
        call: hashicorp-vault-leases.renewlease
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sys/leases/revoke
      name: sys-leases-revoke
      description: REST surface for sys-leases-revoke.
      operations:
      - method: PUT
        name: revokelease
        description: Revoke a lease
        call: hashicorp-vault-leases.revokelease
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hashicorp-vault-leases-mcp
    port: 9090
    transport: http
    description: MCP adapter for HashiCorp Vault HTTP API — Leases. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: lookup-lease
      description: Lookup a lease
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: hashicorp-vault-leases.lookuplease
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: renew-lease
      description: Renew a lease
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: hashicorp-vault-leases.renewlease
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: revoke-lease
      description: Revoke a lease
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: hashicorp-vault-leases.revokelease
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
